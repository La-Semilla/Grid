<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midigrid Bridge — LPX to Workshop Computer</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <style>
    :root {
      --bg: #121316;
      --card: #1c1e24;
      --accent: #ff5500;
      --text: #eceff4;
      --muted: #4c566a;
      --green: #a3be8c;
      --red: #bf616a;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; color: var(--accent); }
    .status-bar { display: flex; gap: 15px; margin-bottom: 20px; }
    .badge { padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; background: var(--card); border: 1px solid var(--muted); }
    .badge.active { border-color: var(--green); color: var(--green); }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--muted);
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(8, 36px);
      grid-template-rows: repeat(8, 36px);
      gap: 6px;
      background: var(--card);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--muted);
    }
    .pad {
      width: 36px;
      height: 36px;
      background: #2e3440;
      border-radius: 4px;
      transition: background 0.05s ease;
    }
    #console {
      margin-top: 20px;
      width: 100%;
      max-width: 360px;
      height: 120px;
      background: #000;
      color: var(--green);
      font-family: monospace;
      font-size: 0.75rem;
      padding: 10px;
      border-radius: 4px;
      overflow-y: auto;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <h1>LPX &#8594; Workshop Computer Bridge</h1>

  <div class="status-bar">
    <div id="midi-status" class="badge">MIDI: Disconnected</div>
    <div id="serial-status" class="badge">Serial: Disconnected</div>
  </div>

  <div class="controls">
    <button id="btn-midi">Connect Launchpad X</button>
    <button id="btn-serial">Connect Module</button>
    <button id="btn-prog">Force Programmer Mode</button>
  </div>

  <div class="grid" id="virtual-grid"></div>

  <div id="console">> Bridge Initialized. Connect devices to start.</div>

  <script>
    let lpInput = null, lpOutput = null;
    let serialPort = null, writer = null, reader = null;
    const gridEl = document.getElementById('virtual-grid');
    const logEl = document.getElementById('console');

    // Generate 8x8 Virtual Grid UI
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        const pad = document.createElement('div');
        pad.className = 'pad';
        pad.id = `pad-${x}-${y}`;
        gridEl.appendChild(pad);
      }
    }

    function log(msg) {
      logEl.innerHTML += `<br>> ${msg}`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // --- 1. WEB MIDI (LAUNCHPAD X) ---
    document.getElementById('btn-midi').addEventListener('click', async () => {
      try {
        const midi = await navigator.requestMIDIAccess({ sysex: true });
        for (let input of midi.inputs.values()) {
          if (input.name.includes("Launchpad X") || input.name.includes("LPX")) {
            lpInput = input;
            lpInput.onmidimessage = handleMIDI;
          }
        }
        for (let output of midi.outputs.values()) {
          if (output.name.includes("Launchpad X") || output.name.includes("LPX")) {
            lpOutput = output;
          }
        }

        if (lpInput && lpOutput) {
          document.getElementById('midi-status').textContent = "MIDI: Connected";
          document.getElementById('midi-status').classList.add('active');
          enableProgrammerMode();
          log("Launchpad X connected & Programmer Mode active.");
        } else {
          log("Launchpad X not found.");
        }
      } catch (err) {
        log("MIDI Error: " + err.message);
      }
    });

    function enableProgrammerMode() {
      if (lpOutput) {
        // SysEx command to put Launchpad X into Programmer Mode
        lpOutput.send([0xF0, 0x00, 0x20, 0x29, 0x02, 0x0C, 0x0E, 0x01, 0xF7]);
      }
    }

    document.getElementById('btn-prog').addEventListener('click', enableProgrammerMode);

    function handleMIDI(msg) {
      const [status, note, velocity] = msg.data;
      const isNoteOn = (status & 0xF0) === 0x90 && velocity > 0;
      const isNoteOff = (status & 0xF0) === 0x80 || ((status & 0xF0) === 0x90 && velocity === 0);

      const col = note % 10;
      const row = Math.floor(note / 10);

      // Validate 8x8 Grid Notes (11 to 88)
      if (col >= 1 && col <= 8 && row >= 1 && row <= 8) {
        const x = col - 1;
        const y = 8 - row; // Map Row 8 to Y=0, Row 1 to Y=7

        if (isNoteOn) {
          sendMonomeKey(x, y, 1);
        } else if (isNoteOff) {
          sendMonomeKey(x, y, 0);
        }
      }
    }

    // --- 2. WEB SERIAL (WORKSHOP COMPUTER) ---
    document.getElementById('btn-serial').addEventListener('click', async () => {
      try {
        serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate: 115200 });
        writer = serialPort.writable.getWriter();
        
        document.getElementById('serial-status').textContent = "Serial: Connected";
        document.getElementById('serial-status').classList.add('active');
        log("Workshop Computer serial connection open.");

        readSerialLoop();
      } catch (err) {
        log("Serial Error: " + err.message);
      }
    });

    async function sendMonomeKey(x, y, state) {
      const cmd = state ? 0x20 : 0x21; // 0x20 = key down, 0x21 = key up
      if (writer) {
        await writer.write(new Uint8Array([cmd, x, y]));
      }
    }

    // --- 3. SERIAL PARSER (FEEDBACK BACK TO LPX LEDs) ---
    async function readSerialLoop() {
      let buffer = [];
      while (serialPort.readable) {
        reader = serialPort.readable.getReader();
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            for (let byte of value) {
              buffer.push(byte);
              processSerialBuffer(buffer);
            }
          }
        } catch (err) {
          log("Read Error: " + err);
        } finally {
          reader.releaseLock();
        }
      }
    }

    function processSerialBuffer(buf) {
      if (buf.length === 0) return;
      const cmd = buf[0];

      // Handle Monome Protocol LED Commands
      if (cmd === 0x10 && buf.length >= 4) { // Set Single LED
        const [_, x, y, state] = buf.splice(0, 4);
        updatePadLED(x, y, state ? 15 : 0);
      } else if (cmd === 0x18 && buf.length >= 4) { // Level Set Single LED
        const [_, x, y, level] = buf.splice(0, 4);
        updatePadLED(x, y, level);
      } else if (cmd === 0x11 && buf.length >= 2) { // Clear/Fill All
        const [_, state] = buf.splice(0, 2);
        for (let y = 0; y < 8; y++) {
          for (let x = 0; x < 8; x++) updatePadLED(x, y, state ? 15 : 0);
        }
      }
    }

    function updatePadLED(x, y, level) {
      // 1. Update Virtual UI
      const pad = document.getElementById(`pad-${x}-${y}`);
      if (pad) {
        const opacity = level / 15;
        pad.style.background = level > 0 ? `rgba(255, 85, 0, ${opacity})` : '#2e3440';
      }

      // 2. Send LED update to Launchpad X Hardware
      if (lpOutput) {
        const note = (8 - y) * 10 + (x + 1);
        // Map 0-15 brightness level to LPX palette colors
        const color = level === 0 ? 0 : (level > 8 ? 5 : 1); // 5 = Red, 1 = White
        lpOutput.send([0x90, note, color]);
      }
    }
  </script>
</body>
</html>
