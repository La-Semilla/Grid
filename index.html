<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midigrid Bridge — LPX to Workshop Computer</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <style>
    :root {
      --bg: #121316;
      --card: #1c1e24;
      --accent: #ff5500;
      --text: #eceff4;
      --muted: #4c566a;
      --green: #a3be8c;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; color: var(--accent); }
    .status-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .badge { padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; background: var(--card); border: 1px solid var(--muted); }
    .badge.active { border-color: var(--green); color: var(--green); }
    
    .panel {
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: bold;
    }
    select, button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--muted);
      padding: 8px 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
    }
    select { width: 100%; cursor: pointer; }
    button {
      background: var(--card);
      cursor: pointer;
      font-weight: bold;
      transition: border-color 0.2s;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .row { display: flex; gap: 8px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(8, 36px);
      grid-template-rows: repeat(8, 36px);
      gap: 6px;
      background: var(--card);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--muted);
    }
    .pad {
      width: 36px;
      height: 36px;
      background: #2e3440;
      border-radius: 4px;
      transition: background 0.05s ease;
    }
    #console {
      margin-top: 20px;
      width: 100%;
      max-width: 420px;
      height: 120px;
      background: #000;
      color: var(--green);
      font-family: monospace;
      font-size: 0.75rem;
      padding: 10px;
      border-radius: 4px;
      overflow-y: auto;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <h1>LPX &#8594; Workshop Computer Bridge</h1>

  <div class="status-bar">
    <div id="midi-status" class="badge">MIDI: Disconnected</div>
    <div id="serial-status" class="badge">Serial: Disconnected</div>
  </div>

  <div class="panel">
    <!-- MIDI SELECTORS -->
    <div class="field-group">
      <label for="select-midi-in">MIDI Input Device</label>
      <select id="select-midi-in"><option value="">-- Scanning MIDI Inputs --</option></select>
    </div>

    <div class="field-group">
      <label for="select-midi-out">MIDI Output Device</label>
      <select id="select-midi-out"><option value="">-- Scanning MIDI Outputs --</option></select>
    </div>

    <div class="row">
      <button id="btn-midi-connect" style="flex: 2;">Connect MIDI</button>
      <button id="btn-prog" style="flex: 1;">Force Prog Mode</button>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--muted); margin: 4px 0;">

    <!-- SERIAL SELECTORS -->
    <div class="field-group">
      <label for="select-serial">USB Serial Device (Module)</label>
      <div class="row">
        <select id="select-serial"><option value="">-- Select Serial Port --</option></select>
        <button id="btn-serial-pair">Pair USB</button>
      </div>
    </div>

    <div class="row">
      <button id="btn-serial-connect" style="flex: 2;">Connect Module Serial</button>
      <button id="btn-handshake" style="flex: 1;">Send Handshake</button>
    </div>
  </div>

  <div class="grid" id="virtual-grid"></div>

  <div id="console">> Bridge Initialized. Select your connections above.</div>

  <script>
    let midiAccess = null;
    let lpInput = null, lpOutput = null;
    let serialPort = null, writer = null, reader = null;
    const gridEl = document.getElementById('virtual-grid');
    const logEl = document.getElementById('console');

    // Generate 8x8 Virtual Grid UI
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        const pad = document.createElement('div');
        pad.className = 'pad';
        pad.id = `pad-${x}-${y}`;
        gridEl.appendChild(pad);
      }
    }

    function log(msg) {
      logEl.innerHTML += `<br>> ${msg}`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // --- 1. WEB MIDI SETUP ---
    async function initMIDI() {
      try {
        midiAccess = await navigator.requestMIDIAccess({ sysex: true });
        populateMidiDropdowns();
        midiAccess.onstatechange = populateMidiDropdowns;
      } catch (err) {
        log("MIDI Error: " + err.message);
      }
    }

    function populateMidiDropdowns() {
      if (!midiAccess) return;
      const inSelect = document.getElementById('select-midi-in');
      const outSelect = document.getElementById('select-midi-out');

      const prevIn = inSelect.value;
      const prevOut = outSelect.value;

      inSelect.innerHTML = '<option value="">-- Select MIDI Input --</option>';
      outSelect.innerHTML = '<option value="">-- Select MIDI Output --</option>';

      for (let input of midiAccess.inputs.values()) {
        const opt = document.createElement('option');
        opt.value = input.id;
        opt.textContent = input.name;
        if (!prevIn && (input.name.includes("Launchpad X") || input.name.includes("LPX")) && !input.name.includes("DAW")) {
          opt.selected = true;
        } else if (input.id === prevIn) {
          opt.selected = true;
        }
        inSelect.appendChild(opt);
      }

      for (let output of midiAccess.outputs.values()) {
        const opt = document.createElement('option');
        opt.value = output.id;
        opt.textContent = output.name;
        if (!prevOut && (output.name.includes("Launchpad X") || output.name.includes("LPX")) && !output.name.includes("DAW")) {
          opt.selected = true;
        } else if (output.id === prevOut) {
          opt.selected = true;
        }
        outSelect.appendChild(opt);
      }
    }

    document.getElementById('btn-midi-connect').addEventListener('click', () => {
      const inId = document.getElementById('select-midi-in').value;
      const outId = document.getElementById('select-midi-out').value;

      if (!inId || !outId) {
        log("Please select both MIDI Input and Output ports.");
        return;
      }

      lpInput = midiAccess.inputs.get(inId);
      lpOutput = midiAccess.outputs.get(outId);

      if (lpInput && lpOutput) {
        lpInput.onmidimessage = handleMIDI;
        document.getElementById('midi-status').textContent = "MIDI: " + lpInput.name;
        document.getElementById('midi-status').classList.add('active');
        log(`Bound Input: ${lpInput.name}`);
        log(`Bound Output: ${lpOutput.name}`);
        enableProgrammerMode();
      }
    });

    function enableProgrammerMode() {
      if (lpOutput) {
        lpOutput.send([0xF0, 0x00, 0x20, 0x29, 0x02, 0x0C, 0x0E, 0x01, 0xF7]);
        log("Sent Programmer Mode SysEx.");
      }
    }

    document.getElementById('btn-prog').addEventListener('click', enableProgrammerMode);

    function handleMIDI(msg) {
      const [status, note, velocity] = msg.data;
      const isNoteOn = (status & 0xF0) === 0x90 && velocity > 0;
      const isNoteOff = (status & 0xF0) === 0x80 || ((status & 0xF0) === 0x90 && velocity === 0);

      const col = note % 10;
      const row = Math.floor(note / 10);

      if (col >= 1 && col <= 8 && row >= 1 && row <= 8) {
        const x = col - 1;
        const y = 8 - row;

        if (isNoteOn) {
          updatePadLED(x, y, 15);
          sendMonomeKey(x, y, 1);
        } else if (isNoteOff) {
          updatePadLED(x, y, 0);
          sendMonomeKey(x, y, 0);
        }
      }
    }

    // --- 2. WEB SERIAL SETUP ---
    async function updateSerialDropdown() {
      if (!('serial' in navigator)) {
        log("Web Serial API is not supported in this browser.");
        return;
      }
      const ports = await navigator.serial.getPorts();
      const serialSelect = document.getElementById('select-serial');
      serialSelect.innerHTML = '<option value="">-- Select Paired Port --</option>';

      ports.forEach((port, index) => {
        const info = port.getInfo();
        const opt = document.createElement('option');
        opt.value = index;
        const vid = info.usbVendorId ? `0x${info.usbVendorId.toString(16)}` : 'N/A';
        const pid = info.usbProductId ? `0x${info.usbProductId.toString(16)}` : 'N/A';
        opt.textContent = `USB Device [VID: ${vid}, PID: ${pid}]`;
        serialSelect.appendChild(opt);
      });
    }

    document.getElementById('btn-serial-pair').addEventListener('click', async () => {
      try {
        const newPort = await navigator.serial.requestPort();
        await updateSerialDropdown();
        const ports = await navigator.serial.getPorts();
        const idx = ports.indexOf(newPort);
        if (idx !== -1) {
          document.getElementById('select-serial').value = idx;
        }
        log("New USB Serial device paired.");
      } catch (err) {
        log("Serial Pair Cancelled/Error: " + err.message);
      }
    });

    document.getElementById('btn-serial-connect').addEventListener('click', async () => {
      const idx = document.getElementById('select-serial').value;
      const ports = await navigator.serial.getPorts();

      if (idx === "" || !ports[idx]) {
        log("Select or Pair a Serial device first.");
        return;
      }

      try {
        serialPort = ports[idx];
        await serialPort.open({ baudRate: 115200 });
        
        // Assert DTR (Data Terminal Ready) so RP2040 knows a serial host is active
        await serialPort.setSignals({ dataTerminalReady: true, requestToSend: true });
        
        writer = serialPort.writable.getWriter();

        document.getElementById('serial-status').textContent = "Serial: Connected";
        document.getElementById('serial-status').classList.add('active');
        log("Workshop Computer serial port opened with DTR enabled.");

        // Send Monome Handshake / Query
        sendMonomeHandshake();

        readSerialLoop();
      } catch (err) {
        log("Serial Connection Error: " + err.message);
      }
    });

    async function sendMonomeHandshake() {
      if (writer) {
        // Monome Protocol: sys/info query [0x00, 0x00]
        await writer.write(new Uint8Array([0x00, 0x00]));
        log("Sent Monome System Query (Handshake).");
      }
    }

    document.getElementById('btn-handshake').addEventListener('click', sendMonomeHandshake);

    async function sendMonomeKey(x, y, state) {
      const cmd = state ? 0x20 : 0x21;
      if (writer) {
        await writer.write(new Uint8Array([cmd, x, y]));
      }
    }

    // --- 3. SERIAL PARSER ---
    async function readSerialLoop() {
      let buffer = [];
      while (serialPort.readable) {
        reader = serialPort.readable.getReader();
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            for (let byte of value) {
              buffer.push(byte);
              processSerialBuffer(buffer);
            }
          }
        } catch (err) {
          log("Read Error: " + err);
        } finally {
          reader.releaseLock();
        }
      }
    }

    function processSerialBuffer(buf) {
      if (buf.length === 0) return;
      const cmd = buf[0];

      if (cmd === 0x10 && buf.length >= 4) {
        const [_, x, y, state] = buf.splice(0, 4);
        updatePadLED(x, y, state ? 15 : 0);
      } else if (cmd === 0x18 && buf.length >= 4) {
        const [_, x, y, level] = buf.splice(0, 4);
        updatePadLED(x, y, level);
      } else if (cmd === 0x11 && buf.length >= 2) {
        const [_, state] = buf.splice(0, 2);
        for (let y = 0; y < 8; y++) {
          for (let x = 0; x < 8; x++) updatePadLED(x, y, state ? 15 : 0);
        }
      }
    }

    function updatePadLED(x, y, level) {
      const pad = document.getElementById(`pad-${x}-${y}`);
      if (pad) {
        const opacity = level / 15;
        pad.style.background = level > 0 ? `rgba(255, 85, 0, ${opacity || 0.3})` : '#2e3440';
      }

      if (lpOutput) {
        const note = (8 - y) * 10 + (x + 1);
        const color = level === 0 ? 0 : (level > 8 ? 5 : 45);
        lpOutput.send([0x90, note, color]);
      }
    }

    initMIDI();
    updateSerialDropdown();
  </script>
</body>
</html>"""
